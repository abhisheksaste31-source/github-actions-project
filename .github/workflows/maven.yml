name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]

jobs:

  # ==========================================
  # BUILD + SONARQUBE
  # ==========================================
  build:

    # GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Check Maven
      - name: Check Maven
        run: |
          mvn -version

      # 4. Build with Maven
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 5. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

      # 6. Install SonarQube Scanner CLI
      - name: Install SonarQube Scanner CLI
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.3.0.5189-linux-x64.zip \
            -O /tmp/sonar-scanner.zip

          unzip -q /tmp/sonar-scanner.zip -d "$HOME"

          mv "$HOME/sonar-scanner-7.3.0.5189-linux-x64" \
             "$HOME/sonar-scanner-cli"

          echo "$HOME/sonar-scanner-cli/bin" >> "$GITHUB_PATH"

          sonar-scanner -v

      # 7. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |

          echo "SonarQube server URL: $SONAR_HOST"

          echo "Checking SonarQube server..."

          curl -I "$SONAR_HOST"

          echo "Running SonarQube analysis..."

          sonar-scanner \
            -Dsonar.projectKey=hotstar \
            -Dsonar.sources=src \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"


  # ==========================================
  # DEPLOY TO TOMCAT
  # ==========================================
  deploy:

    # GitHub-hosted runner
    runs-on: ubuntu-latest

    needs: build

    environment: production

    steps:

      # 8. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      # 9. Check downloaded WAR
      - name: Check WAR file
        run: |
          ls -lh
          ls -lh *.war

      # 10. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        run: |

          WAR_FILE=$(ls *.war)

          echo "Deploying $WAR_FILE to Tomcat..."

          curl -v --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}@${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"

      # 11. Verify deployment
      - name: Verify deployment
        run: |

          echo "Checking application..."

          curl -I \
            "http://${{ secrets.TOMCAT_HOST }}/myapp"
